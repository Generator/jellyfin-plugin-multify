name: '📦 Release Plugin'

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  REPO: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the tag commit's parentage is available for the
          # fast-forward push of manifest.json to main (git push HEAD:main).
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Parse tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $TAG"

      - name: Extract changelog from tag
        id: changelog
        run: |
          # The annotated tag message (see AGENTS.md "Git tags with changelog")
          # is the canonical changelog for this release.
          git fetch --tags --force origin
          BODY="$(git tag -l --format='%(contents)' "v${{ steps.tag.outputs.version }}")"
          if [ -z "$BODY" ]; then
            BODY="Release ${{ steps.tag.outputs.version }}"
          fi
          {
            echo "body<<_MULTIFY_CHANGELOG_EOF_"
            printf '%s\n' "$BODY"
            echo "_MULTIFY_CHANGELOG_EOF_"
          } >> "$GITHUB_OUTPUT"

      - name: Build & Package
        env:
          RELEASE_CHANGELOG: ${{ steps.changelog.outputs.body }}
        run: |
          # manifest.json is tracked on main and the tag points at a main
          # commit, so the previous manifest is already in the working tree;
          # package.py merges into it (appends the new version).
          python3 scripts/package.py \
            --version "${{ steps.tag.outputs.version }}" \
            --repo "${{ env.REPO }}" \
            --changelog "$RELEASE_CHANGELOG"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-release
          path: artifacts/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          body: ${{ steps.changelog.outputs.body }}

      - name: Commit manifest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Commit on the detached tag HEAD, then push HEAD:main. Because the
          # tag sits on main (and checkout fetched full history), this is a
          # fast-forward that keeps manifest.json version history on main.
          git add manifest.json
          if git diff --cached --quiet; then
            echo "No manifest changes"
          else
            git commit -m "Update manifest for v${{ steps.tag.outputs.version }}"
            git push origin HEAD:main
          fi
