name: '📦 Release Plugin'

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  REPO: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Parse tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $TAG"

      - name: Extract changelog from tag
        id: changelog
        run: |
          # The annotated tag message (see AGENTS.md "Git tags with changelog")
          # is the canonical changelog for this release.
          git fetch --tags --force origin
          BODY="$(git tag -l --format='%(contents)' "v${{ steps.tag.outputs.version }}")"
          if [ -z "$BODY" ]; then
            BODY="Release ${{ steps.tag.outputs.version }}"
          fi
          {
            echo "body<<_MULTIFY_CHANGELOG_EOF_"
            printf '%s\n' "$BODY"
            echo "_MULTIFY_CHANGELOG_EOF_"
          } >> "$GITHUB_OUTPUT"

      - name: Build & Package
        env:
          RELEASE_CHANGELOG: ${{ steps.changelog.outputs.body }}
        run: |
          # Merge with any existing manifest from the manifest branch so version
          # history is preserved across releases (package.py appends to manifest.json).
          # Only treat the branch as absent when ls-remote confirms it does not exist;
          # transport/permission failures abort the step so history can never be
          # silently overwritten.
          if git ls-remote --heads origin manifest | grep -q "refs/heads/manifest"; then
            git fetch origin manifest
            git show origin/manifest:manifest.json > /tmp/existing-manifest.json
            cp /tmp/existing-manifest.json manifest.json
          fi
          python3 scripts/package.py \
            --version "${{ steps.tag.outputs.version }}" \
            --repo "${{ env.REPO }}" \
            --changelog "$RELEASE_CHANGELOG"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-release
          path: artifacts/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          body: ${{ steps.changelog.outputs.body }}

      - name: Push manifest to manifest branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Save manifest from build step
          cp manifest.json /tmp/manifest.json

          # Switch to manifest branch
          git fetch origin manifest || true
          git checkout manifest 2>/dev/null || git checkout --orphan manifest

          # Clean working tree and place manifest
          git rm -rf . 2>/dev/null || true
          cp /tmp/manifest.json .
          git add manifest.json

          # Commit only if there are changes
          git diff --cached --quiet || git commit -m "Update manifest for v${{ steps.tag.outputs.version }}"
          git push origin manifest
